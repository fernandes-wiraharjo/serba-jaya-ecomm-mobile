name: serba_jaya_mobile
description: Fondasi aplikasi mobile Serba Jaya Ecommerce.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.5
  flutter: '>=3.41.9'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^17.0.0
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  flutter_svg: ^2.2.3
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/auth/
    - assets/navigation/
    - assets/header/
    - assets/fonts/roboto/OFL.txt
  fonts:
    - family: SerbaRoboto
      fonts:
        - asset: assets/fonts/roboto/Roboto.ttf
    - family: AuthRoboto
      fonts:
        - asset: assets/fonts/roboto/Roboto.ttf
